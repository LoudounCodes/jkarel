name: Publish curriculum

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'scripts/**'
      - 'src/**'
      - 'lib/**'
      - 'examples/**'
      - 'docs/labs/**'
      - 'build.xml'
      - 'README.md'
      - '*LICENSE*'
      - 'LICENSING.md'
      - 'NON-ENDORSEMENT.TXT'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '18'
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Build and test classroom package
        run: ant build-all build-starters
      - name: Verify relocated starters and documentation
        run: python3 scripts/verify_starters.py
      - name: Assemble curriculum site
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
